<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Community Link</title>
    <link rel="stylesheet" href="/styles.css?v=8" />
  </head>
  <body>
    <!-- Login -->
    <section id="login-view" class="login-wrap hidden">
      <div class="login-card">
        <div class="logo">CL</div>
        <h1>Community Link</h1>
        <p class="muted">Talk to your zone. Messages clear themselves once they're handled.</p>

        <form id="login-form" class="stack">
          <label class="field">
            <span>Your name</span>
            <input id="login-name" required maxlength="60" autocomplete="nickname" placeholder="e.g. Nikhil" />
          </label>

          <div class="field">
            <span>I am a</span>
            <div class="seg" role="radiogroup">
              <label class="seg-opt">
                <input type="radio" name="role" value="participant" checked />
                <span>Participant</span>
              </label>
              <label class="seg-opt">
                <input type="radio" name="role" value="organiser" />
                <span>Organiser</span>
              </label>
            </div>
          </div>

          <label id="organiser-code-row" class="field hidden">
            <span>Organiser code</span>
            <input id="login-code" type="password" autocomplete="off" />
          </label>

          <button type="submit" class="btn primary block">Enter</button>
          <p id="login-status" class="muted small"></p>
          <p id="login-error" class="error" role="alert"></p>
        </form>
      </div>
    </section>

    <!-- App -->
    <div id="app-view" class="app hidden">
      <header class="topbar">
        <div class="brand"><span class="logo small">CL</span> Community Link</div>
        <div class="me">
          <span id="me-avatar" class="avatar"></span>
          <span id="me-text" class="me-text"></span>
          <button id="logout" class="btn ghost small">Log out</button>
        </div>
      </header>

      <div class="layout">
        <aside class="rail">
          <p class="rail-title">Show</p>
          <nav id="rail" class="rail-list"></nav>
          <div class="rail-note muted small">
            Posts clear when they're closed or when their timeline ends.
          </div>
        </aside>

        <main class="main">
          <div id="feed" class="feed"></div>
          <p id="feed-empty" class="empty hidden">
            <strong>Nothing here yet.</strong><br />
            Send a message below to start a conversation.
          </p>

          <form id="composer" class="composer">
            <div id="template-chips" class="chips" role="radiogroup" aria-label="Message type"></div>
            <p id="template-desc" class="muted small"></p>

            <div id="channel-row" class="channel-row">
              <span class="muted small">Send to</span>
              <div id="channel-seg" class="seg small-seg" role="radiogroup"></div>
              <span id="channel-hint" class="muted small"></span>
            </div>

            <div class="input-row">
              <textarea id="msg-input" rows="1" maxlength="2000" placeholder="Write a message…"></textarea>
              <button type="submit" class="btn primary">Send</button>
            </div>

            <details id="details" class="details">
              <summary>Add location or timeline</summary>
              <div class="details-grid">
                <label id="location-row" class="field">
                  <span>Location</span>
                  <input id="msg-location" maxlength="120" placeholder="e.g. Hall B, registration desk" />
                </label>
                <label class="field">
                  <span>Clears after (minutes)</span>
                  <input id="msg-ttl" type="number" min="5" step="5" />
                </label>
              </div>
            </details>
            <p id="composer-error" class="error" role="alert"></p>
          </form>
        </main>
      </div>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>

    <script>
      window.addEventListener("unhandledrejection", function (e) {
        var box = document.getElementById("login-error");
        if (box) box.textContent = "Error: " + (e.reason && e.reason.message ? e.reason.message : e.reason);
      });
      window.addEventListener("error", function (e) {
        var box = document.getElementById("login-error");
        if (box) box.textContent = "Script error: " + e.message;
      });
    </script>
    <script src="/app.js?v=8"></script>
  </body>
</html>
